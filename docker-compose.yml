services:
  api:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    container_name: llm-rag-api
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - qdrant
      - postgres

  redis:
    image: redis:8
    container_name: llm-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: llm-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:18
    container_name: llm-rag-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
