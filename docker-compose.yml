services:
  api:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    container_name: llm-rag-api
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-config log_config.json --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"