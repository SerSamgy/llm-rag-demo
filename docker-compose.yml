services:
  api:
    image: ghcr.io/astral-sh/uv:python3.13-trixie-slim
    container_name: llm-rag-api
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-config log_default_config.yaml --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"
  chromadb:
    image: chromadb/chroma
    container_name: llm-rag-chromadb
    volumes:
      - chroma_data:/data
    ports:
      - "8000:8000"

volumes:
  chroma_data: